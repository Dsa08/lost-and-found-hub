name: lost_and_found_hub
description: Lost & Found Hub - Aplikasi temuan barang dengan sistem bounty dan guild.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  cloud_functions: ^5.1.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # QR Code
  mobile_scanner: ^5.2.0
  qr_flutter: ^4.1.0

  # Security & Crypto
  dart_jsonwebtoken: ^2.14.0
  crypto: ^3.0.3

  # UI & Images
  cached_network_image: ^3.4.0
  image_picker: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  timeago: ^3.7.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
